name: Test MinGW

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_CORE: sysmon
  FORCE_COLOR: 1

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash.exe --login -eo pipefail "{0}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # MINGW64 is upstream's 12.3.0 environment, but MSYS2 no longer ships its
          # python-pyqt6; UCRT64 (upstream's environment from #10300) has it
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
            qt: ""
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            qt: mingw-w64-ucrt-x86_64-python-pyqt6

    env:
      MSYSTEM: ${{ matrix.msystem }}
      CHERE_INVOKING: 1

    timeout-minutes: 30
    name: "MinGW ${{ matrix.msystem }}"

    steps:
      - name: Checkout Pillow
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up shell
        run: echo "C:\msys64\usr\bin\" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Install dependencies
        run: |
          pacman -S --noconfirm \
              ${{ matrix.prefix }}-freetype \
              ${{ matrix.prefix }}-gcc \
              ${{ matrix.prefix }}-ghostscript \
              ${{ matrix.prefix }}-lcms2 \
              ${{ matrix.prefix }}-libavif \
              ${{ matrix.prefix }}-libimagequant \
              ${{ matrix.prefix }}-libjpeg-turbo \
              ${{ matrix.prefix }}-libraqm \
              ${{ matrix.prefix }}-libtiff \
              ${{ matrix.prefix }}-libwebp \
              ${{ matrix.prefix }}-openjpeg2 \
              ${{ matrix.prefix }}-python-numpy \
              ${{ matrix.prefix }}-python-olefile \
              ${{ matrix.prefix }}-python-pip \
              ${{ matrix.prefix }}-python-pytest \
              ${{ matrix.prefix }}-python-pytest-cov \
              ${{ matrix.prefix }}-python-pytest-timeout \
              ${{ matrix.qt }}

          pushd depends && ./install_extra_test_images.sh && popd

      - name: Build Pillow
        run: CFLAGS="-coverage" python3 -m pip install .

      - name: Test Pillow
        run: |
          python3 selftest.py --installed
          .ci/test.sh

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: ./coverage.xml
          flags: GHA_Windows
          name: "MSYS2 MinGW"
